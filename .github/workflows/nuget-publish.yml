name: NuGet Publish

on:
  push:
    branches: [main]
    paths: ['**/*.csproj', '**/*.cs']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build
        run: dotnet build Cli/NongCli.csproj -c Release

  push:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - Cli/NongCli.csproj
          - Data/Nong.Data.csproj
          - Docx/DocxCore.csproj
          - Excel/ExcelCore.csproj
          - Pandoc/PandocCore.csproj
          - Literature/LiteratureCore.csproj
          - Aminer/Nong.Aminer.csproj
          - Metaso/Nong.Metaso.csproj
          - Inspect/Inspect.csproj
          - Genre/Genre.csproj
          - Bioicons/Bioicons.csproj
          - OcrDictionary/OcrDictionary.csproj
          - Chart/tools/nong-chart.csproj
          - Diagram/tools/nong-diagram.csproj
          - Imaging/tools/nong-imaging.csproj
          - Pdf/tools/nong-pdf.csproj
          - Pptx/tools/nong-pptx.csproj
          - MultiModal/tools/nong-ocr.csproj
          - NongRuntime/tools/nong-runtime.csproj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Get OIDC token
        id: token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('https://api.nuget.org/v3/index.json');
            core.setOutput('id_token', token);
      - name: Pack & Push
        run: |
          dotnet pack ${{ matrix.project }} -c Release --no-build -o nupkg/
          dotnet nuget push nupkg\*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate --api-key ${{ steps.token.outputs.id_token }}
