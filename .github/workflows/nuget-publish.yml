name: NuGet Publish (Trusted Publishing)

on:
  push:
    branches: [main]
    paths:
      - '**/*.csproj'
      - '**/*.cs'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pack-and-push:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test Cli.Tests/Cli.Tests.csproj -c Release --no-build

      - name: Pack all first-party packages
        run: |
          dotnet pack Cli/NongCli.csproj -c Release --no-build -o nupkg/
          dotnet pack Data/Nong.Data.csproj -c Release --no-build -o nupkg/
          dotnet pack Docx/DocxCore.csproj -c Release --no-build -o nupkg/
          dotnet pack Excel/ExcelCore.csproj -c Release --no-build -o nupkg/
          dotnet pack Pdf/PdfCore.csproj -c Release --no-build -o nupkg/
          dotnet pack Pptx/PptxCore.csproj -c Release --no-build -o nupkg/
          dotnet pack Pandoc/PandocCore.csproj -c Release --no-build -o nupkg/
          dotnet pack Literature/LiteratureCore.csproj -c Release --no-build -o nupkg/
          dotnet pack Aminer/Nong.Aminer.csproj -c Release --no-build -o nupkg/
          dotnet pack Metaso/Nong.Metaso.csproj -c Release --no-build -o nupkg/
          dotnet pack Inspect/Inspect.csproj -c Release --no-build -o nupkg/
          dotnet pack Genre/Genre.csproj -c Release --no-build -o nupkg/
          dotnet pack Bioicons/Bioicons.csproj -c Release --no-build -o nupkg/
          dotnet pack OcrDictionary/OcrDictionary.csproj -c Release --no-build -o nupkg/
          dotnet pack NongRuntime/tools/nong-runtime.csproj -c Release --no-build -o nupkg/
          dotnet pack Chart/tools/nong-chart.csproj -c Release --no-build -o nupkg/
          dotnet pack Diagram/tools/nong-diagram.csproj -c Release --no-build -o nupkg/
          dotnet pack Imaging/tools/nong-imaging.csproj -c Release --no-build -o nupkg/
          dotnet pack Pdf/tools/nong-pdf.csproj -c Release --no-build -o nupkg/
          dotnet pack Pptx/tools/nong-pptx.csproj -c Release --no-build -o nupkg/
          dotnet pack MultiModal/tools/nong-ocr.csproj -c Release --no-build -o nupkg/

      - name: Push to nuget.org (Trusted Publishing)
        run: dotnet nuget push nupkg\*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate
